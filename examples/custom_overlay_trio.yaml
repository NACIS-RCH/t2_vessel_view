# Custom overlay trio panel config for t2_vessel_view.
#
# Copy this file next to your study data, edit the paths, then run:
#   t2vv_render_existing --source-dir /path/to/T2VesselView \
#     --panels custom_overlay_trio --panel-config ./my_trio.yaml
#
# Or generate a fresh copy with:
#   python -m t2vesselviewcode.t2_vessel_view_main \
#     --write-panel-config-example ./my_trio.yaml
#
# Notes:
# - Both erosion snapshots and slice sweeps are always generated.
# - All erosion depths present for each base are used (can be slow).
# - left/right (and surg_left_*/surg_right_*) slice sweeps stop just past midline.
# - opacity is 0–100 (same as MRIcroGL / --overlayN-opacity).
# - Allowed base values: t1, t2_cor, t2_tra, t2_sag, t2_3d, flair
# - Allowed angles: left, right, anterior, posterior, superior, inferior,
#   surg_left_lat, surg_right_lat, surg_left_ato, surg_right_ato
# - Use 2–4 slots.

angles:
  - superior
  - left
  # - surg_left_lat
  # - surg_right_ato

slots:
  - base: t1
    overlays:
      - path: /data/pet.nii.gz
        color: jet
        name: PET
        opacity: 60

  - base: t2_cor
    overlays:
      - path: /data/fmri.nii.gz
        color: hot
        name: fMRI
        opacity: 50
      - path: /data/tract1.nii.gz
        color: green
        name: TractA
        opacity: 80

  - base: flair
    overlays:
      - path: /data/overlay_a.nii.gz
        color: electric_blue
        name: OverlayA
        opacity: 50
