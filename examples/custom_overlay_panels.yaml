# Custom overlay panel for t2_vessel_view.
#
# Run from an existing T2VesselView output:
#   t2vv_render_existing --source-dir /path/to/T2VesselView \
#     --panels custom_overlay_panels \
#     --panel-config /path/to/custom_overlay_panels.yaml
#
# Notes:
# - Choose 2 to 4 slots. Repeating a base is allowed.
# - Bases are t1, t2, or flair.
# - Named T1-like extras created with --extra-image NAME=PATH can also be used
#   directly as bases (for example, base: t1_gd).
# - Overlays are optional per slot. A slot with only "base" displays the
#   structural image without a colorbar.
# - base: t2 automatically selects the best available T2 acquisition:
#     left/right: matching-side sagittal, generic sagittal, 3D, then transverse
#     anterior/posterior: coronal, then 3D
#     superior/inferior: transverse, then 3D
#     surgical/ATO: matching-side sagittal, generic sagittal, then 3D
#   An opposite-side sagittal acquisition is never used as a fallback.
# - Overlay images must already be aligned with the structural images.
# - Relative overlay paths are resolved relative to this YAML file.
# - opacity is an MRIcroGL integer from 0 to 100.
# - min and max are optional overlay window values. Provide both together with
#   max greater than min. If omitted, they are estimated with a warning.
# - Exact 0/1 binary overlays are detected automatically. Their legend uses one
#   solid swatch matching foreground value 1, without min/max endpoint labels.
# - Composite erosion views are rendered at every available depth.
# - Composite slice sweeps are rendered only at slice_erode_depth.
# - Use integer 35 for filename prefix 035 (3.5 mm); do not use unquoted 035.
# - Brand-new CLI --display-angle/--slice-plane labels are appended
#   automatically to this panel's angle list.

slice_erode_depth: 35
pptx_name: custom_overlay_panels

angles:
  - superior
  - left
  # - surg_left_lat
  # - surg_right_lat
  # - surg_left_ato
  # - surg_right_ato

# Use `rows` for a two-row panel (1–4 slots per row). For the original one-row
# layout, replace this mapping with a flat `slots:` list containing 2–4 slots.
rows:
  top:
    - base: t1
      overlays:
        - path: ./pet.nii.gz
          color: jet
          name: PET
          opacity: 60
          min: 0
          max: 10

    - base: t2
      overlays:
        - path: ./fmri.nii.gz
          color: hot
          name: fMRI
          opacity: 50
          min: 0
          max: 5
        - path: ./tract.nii.gz
          color: green
          name: Tract
          opacity: 80
          min: 0
          max: 1

  bottom:
    # Structural-only slot: omit "overlays" when none are wanted.
    - base: flair

    # Example named extra after preprocessing with:
    #   --extra-image t1_gd=/path/to/T1_Gd.nii.gz
    # - base: t1_gd
