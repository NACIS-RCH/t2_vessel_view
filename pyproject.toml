[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2vesselview"
version = "0.1.0"
description = "A package for visualising cortical surface vessels on T2 brain MRI"
readme = "README.md"
authors = [
    {name = "Bonnie Alexander", email = "bonnie.alexander2@rch.org.au"}
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.2",
    "nibabel>=3.2.1",
    "SimpleITK>=2.1.1",
    "pandas>=1.3.0",
    "nipype>=1.8.6",
    "ants>=0.0.1",
]

[project.urls]
Documentation = "https://github.com/NACIS-RCH/t2_vessel_view#readme"
Source = "https://github.com/NACIS-RCH/t2_vessel_view"
Tracker = "https://github.com/NACIS-RCH/t2_vessel_view/issues" 