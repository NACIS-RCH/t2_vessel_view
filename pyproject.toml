[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2vesselview"
version = "0.1.0"
description = "A package for visualising cortical surface vessels on T2 brain MRI"
readme = "README.md"
authors = [
    {name = "Bonnie Alexander", email = "bonnie.alexander2@rch.org.au"}
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "scipy>=1.10.0",
    "nibabel>=5.1.0",
    "pydicom>=2.4.3",
    "SimpleITK>=2.2.1",
    "nipype>=1.8.6",
    "antspyx>=0.5.4",
    "matplotlib>=3.7.0",
    "pyvista>=0.44.0",
    "pyvips>=2.2.0",
    "pyvips-binary>=8.16.0; platform_system == 'Linux'",
    "Pillow>=10.0.0",
    "python-pptx>=0.6.21",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
]

[project.urls]
Documentation = "https://github.com/NACIS-RCH/t2_vessel_view#readme"
Source = "https://github.com/NACIS-RCH/t2_vessel_view"
Tracker = "https://github.com/NACIS-RCH/t2_vessel_view/issues"

[project.scripts]
t2vesselview = "t2vesselviewcode.t2_vessel_view_main:main" 
t2vv_render_existing = "t2vesselviewcode.render_existing_cli:main"